<html class="no-js" lang="en">
<head>
	<meta content="charset=utf-8">

<!-- CSS -->
     <link href="//maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet" type="text/css">

<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #0b0f1a;
  }

  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }

  .hero {
    position: fixed;
    top: 14%;
    left: 8%;
    z-index: 2;
    pointer-events: none;
    color: #e8edf5;
    font-family: "Josefin Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .hero h1 {
    font-size: clamp(32px, 4.6vw, 58px);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin: 0;
  }
  .hero h2 {
    font-size: clamp(16px, 2vw, 24px);
    font-weight: 300;
    color: rgba(232, 237, 245, 0.55);
    margin: 10px 0 0;
    letter-spacing: 0.04em;
  }

</style>
</head>

<body>

<!-- MAIN CONTENT SECTION  _____________________________________________-->
	<section id="content" role="main">

		<canvas id="bg"></canvas>

		<div class="hero">
			<h1>{{ page.main-title }}</h1>
			<h2>{{ page.subtitle }}</h2>
		</div>

	</section>

<!-- jQuery + Bootstrap (nav toggle) -->
  <script src="//code.jquery.com/jquery-2.1.3.min.js"></script>
  <script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>

<!-- interactive pipeline background -->
<script src="/js/bg-pipeline.js"></script>
<script>
  (function () {
    var canvas = document.getElementById('bg');
    if (canvas && window.BG_VARIANTS && window.BG_VARIANTS.pipeline) {
      window.BG_VARIANTS.pipeline.init(canvas, { theme: 'dark' });
    }
  })();
</script>

       </body>
    </html>

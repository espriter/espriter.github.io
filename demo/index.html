<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>espriter — background demo</title>
<link href="//maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet" type="text/css">
<style>
  :root {
    --text: #e8edf5;
    --text-dim: rgba(232, 237, 245, 0.55);
    --pill-bg: rgba(255, 255, 255, 0.06);
    --pill-border: rgba(255, 255, 255, 0.14);
    --pill-active: rgba(56, 189, 248, 0.22);
  }
  html[data-theme="light"] {
    --text: #1e293b;
    --text-dim: rgba(30, 41, 59, 0.55);
    --pill-bg: rgba(15, 23, 42, 0.05);
    --pill-border: rgba(15, 23, 42, 0.12);
    --pill-active: rgba(14, 165, 233, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #0b0f1a;
  }
  html[data-theme="light"] body { background: #f6f8fa; }

  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .hero {
    position: fixed;
    top: 14%;
    left: 8%;
    z-index: 2;
    pointer-events: none;
    color: var(--text);
  }
  .hero h1 {
    font-size: clamp(32px, 4.6vw, 58px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }
  .hero h2 {
    font-size: clamp(18px, 2.2vw, 28px);
    font-weight: 300;
    color: var(--text-dim);
    margin-top: 10px;
    letter-spacing: 0.04em;
  }

  .soc {
    position: fixed;
    bottom: 28px;
    left: 0;
    right: 0;
    z-index: 2;
    text-align: center;
  }
  .soc a {
    color: var(--text-dim);
    font-size: 18px;
    margin: 0 12px;
    text-decoration: none;
    transition: color 0.2s;
  }
  .soc a:hover { color: var(--text); }

  .controls {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 3;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .controls button {
    appearance: none;
    border: 1px solid var(--pill-border);
    background: var(--pill-bg);
    color: var(--text);
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: background 0.2s, border-color 0.2s;
  }
  .controls button:hover { border-color: var(--text-dim); }
  .controls button.active {
    background: var(--pill-active);
    border-color: rgba(56, 189, 248, 0.5);
  }
  #fps {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 3;
    font-size: 11px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="hero">
  <h1>espriter</h1>
  <h2>Data engineer</h2>
</div>

<div class="soc">
  <a href="https://www.linkedin.com/in/gihoonshin" title="LinkedIn"><i class="fa fa-linkedin"></i></a>
  <a href="https://github.com/espriter" title="Github"><i class="fa fa-github"></i></a>
  <a href="https://instagram.com/espriter.life" title="Instagram"><i class="fa fa-instagram"></i></a>
  <a href="mailto:esprit@espriter.net" title="Email"><i class="fa fa-envelope-o"></i></a>
</div>

<div class="controls" id="controls"></div>
<div id="fps"></div>

<script src="bg-flowfield.js"></script>
<script src="bg-pipeline.js"></script>
<script src="bg-streams.js"></script>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('bg');
  var controls = document.getElementById('controls');
  var variants = window.BG_VARIANTS || {};
  var order = ['flow', 'pipeline', 'streams'];
  var current = null;
  var theme = 'dark';

  function setTheme(t) {
    theme = t;
    document.documentElement.setAttribute('data-theme', t);
  }

  function activate(key) {
    var v = variants[key];
    if (!v) return;
    if (current && variants[current]) variants[current].destroy();
    current = key;
    v.init(canvas, { theme: theme });
    location.hash = key;
    render();
  }

  function render() {
    controls.innerHTML = '';
    order.forEach(function (key) {
      var v = variants[key];
      if (!v) return;
      var b = document.createElement('button');
      b.textContent = v.label;
      b.className = key === current ? 'active' : '';
      b.onclick = function () { activate(key); };
      controls.appendChild(b);
    });
    var t = document.createElement('button');
    t.textContent = theme === 'dark' ? '☀ Light' : '☾ Dark';
    t.onclick = function () {
      setTheme(theme === 'dark' ? 'light' : 'dark');
      activate(current);
    };
    controls.appendChild(t);
  }

  // FPS meter (demo only)
  var fpsEl = document.getElementById('fps');
  var frames = 0;
  var last = performance.now();
  (function fpsLoop(now) {
    frames++;
    if (now - last >= 1000) {
      fpsEl.textContent = frames + ' fps';
      frames = 0;
      last = now;
    }
    requestAnimationFrame(fpsLoop);
  })(performance.now());

  setTheme('dark');
  var initial = location.hash.replace('#', '');
  activate(variants[initial] ? initial : 'flow');
})();
</script>

</body>
</html>
